const days=Math.ceil((new Date(2026,9,1)-new Date())/864e5);
document.getElementById('cd').textContent = days>0? days+' days to launch night' : 'LAUNCH NIGHT';

function prog(){
 const done=DATA.filter(d=>S[d.handle]&&S[d.handle]!=='none').length;
 const yes=DATA.filter(d=>S[d.handle]==='yes').length;
 document.getElementById('pbar').style.width=(done/DATA.length*100)+'%';
 document.getElementById('ptxt').textContent=done+' of '+DATA.length+' contacted · '+yes+' interested · 30 slots to fill';
}
const FILTS=[['all','All 36'],['todo','To send'],['A','$100K+'],['B','$40–99K'],['C','$20–39K'],['D','Under $20K'],['yes','Interested']];

document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{
 filt=b.dataset.f;document.querySelectorAll('.f').forEach(x=>x.classList.toggle('on',x===b));render();});

function render(){
 const rows=DATA.filter(d=>{
  const s=S[d.handle]||'none';
  if(filt==='all')return true;
  if(filt==='todo')return s==='none';
  if(filt==='yes')return s==='yes';
  return d.tier===filt;});
 const el=document.getElementById('list');
 if(!rows.length){el.innerHTML='<div class="empty">Nothing here — nice work.</div>';prog();return;}
