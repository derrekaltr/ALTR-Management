# Alternative to `npm run db:start` (embedded postgres) for machines with Docker.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trial_reels
    ports:
      - "5502:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
