<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>{{BASE_CSS}}</style>
<style>
  :root {
    --bg: #050507;
    --accent: #25f4ee;
    --accent-2: #fe2c55;
    --panel: rgba(37, 244, 238, 0.05);
    --line: rgba(255, 255, 255, 0.13);
  }
  .card {
    background:
      radial-gradient(900px 640px at 108% 4%, rgba(254, 44, 85, 0.20), transparent 55%),
      radial-gradient(900px 720px at -8% 100%, rgba(37, 244, 238, 0.14), transparent 55%),
      var(--bg);
  }
  /* neon note watermark */
  .glyph { right: -80px; bottom: -110px; opacity: 0.2; }
  /* crisp white title — TikTok identity carried by the gradient accents, not shadows */
  .service { color: #ffffff; }
  .platform-tag { color: #25f4ee; }
  .platform-tag .tick { background: linear-gradient(90deg, #25f4ee, #fe2c55); }
  .row .v.handle { color: #25f4ee; }
</style>
</head>
<body class="{{CATEGORY_CLASS}} {{SIZE_CLASS}}">
<div class="card">
  <svg class="glyph" width="560" height="560" viewBox="0 0 100 100">
    <path d="M60 12 v46 a16 16 0 1 1 -12 -15.5" fill="none" stroke="#25f4ee" stroke-width="7" stroke-linecap="round"/>
    <path d="M64 16 v46 a16 16 0 1 1 -12 -15.5" fill="none" stroke="#fe2c55" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M62 14 c2 12 10 20 22 21 v11 c-9 0 -17 -3 -22 -8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </svg>
  <div class="removal-ribbon">Removal</div>

  <header class="brand-band">
    <img class="brand-wordmark" src="{{WORDMARK_SRC}}" alt="{{BRAND_NAME}}">
    <div class="brand-division">{{CATEGORY_LABEL}}</div>
  </header>

  <main>
    <div class="platform-tag"><span class="tick"></span>TikTok</div>
    <h1 class="service">{{SERVICE}}</h1>
    <div class="case-type">{{CASE_TYPE}}</div>
    <div class="status {{STATUS_CLASS}}"><span class="dot"></span>{{STATUS}}</div>

    <div class="rows">
      <div class="row"><span class="k">Client</span><span class="v">{{CLIENT}}</span></div>
      <div class="row"><span class="k">Handle</span><span class="v handle">{{HANDLE}}</span></div>
      {{DETAIL_ROWS}}
      {{LINK_ROW}}
    </div>

    {{CRED_BLOCK}}
    {{NOTES_BLOCK}}
  </main>

  <footer class="brand-foot">
    <span class="foot-brand"><img class="foot-monogram" src="{{MONOGRAM_SRC}}">{{BRAND_TAGLINE}}</span>
    <span>TT · {{CATEGORY}}</span>
  </footer>
</div>
</body>
</html>
