const KEY = 'altr_outreach_v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
let filter = 'all';

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); render(); }
function st(id){ return state[id] || (state[id] = {decision:null, message:null}); }
function msgOf(r){ const s = state[r.chat_file]; return (s && s.message !== null && s.message !== undefined) ? s.message : r.message; }
function words(t){ return (t||'').trim().split(/\s+/).filter(Boolean).length; }
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const list = document.getElementById('list');
  const shown = DATA.filter(r => {
    if (filter === 'all') return true;
    if (filter === 'approved') return (state[r.chat_file]||{}).decision === 'approve';
    return r.safety === filter;
  });
  list.innerHTML = shown.map(r => {
    const s = state[r.chat_file] || {};
    const m = msgOf(r), wc = words(m);
    const blocked = r.safety === 'do_not_send';
    const cls = [ 'card', r.safety, s.decision === 'approve' ? 'approved' : '', s.decision === 'skip' ? 'skipped' : '' ].join(' ');
    return `<div class="${cls}">
      <div class="top">
        <span class="handles">${esc(r.handles || '(no handle)')}</span>
        <span class="tag ${r.safety}">${r.safety.replace(/_/g,' ')}</span>
        ${r.reseller === 'yes' ? '<span class="tag rs">reseller</span>' : ''}
        ${r.section === 'B_rebanned_repeat' ? '<span class="tag b">re-banned repeat</span>' : ''}
        <span class="spacer"></span><span class="price">${esc(r.price)}</span>
      </div>
      <div class="meta">
        ${r.phone ? `<span class="ph">${esc(r.phone)}</span>` : `<i>no number — ${esc(r.contact) || 'look up in Messages'}</i>`}
        &nbsp;·&nbsp; ${esc(r.client).slice(0,110)} &nbsp;·&nbsp; last contact ${esc(r.last)}
      </div>
      ${r.safety === 'do_not_send' || r.safety === 'caution'
        ? `<div class="reason">⚠ ${esc(r.safety_reason)}</div>` : ''}
      <div class="why">${esc(r.why).slice(0,240)}</div>
      ${blocked ? '' : `<textarea data-id="${esc(r.chat_file)}" oninput="edit(this)">${esc(m)}</textarea>`}
      <div class="row">
        ${blocked
          ? `<button disabled title="Excluded from the send list">✕ Blocked — not sending</button>`
          : `<button class="ok ${s.decision==='approve'?'on':''}" onclick="dec('${esc(r.chat_file)}','approve')">✓ Approve</button>
             <button class="no ${s.decision==='skip'?'on':''}" onclick="dec('${esc(r.chat_file)}','skip')">Skip</button>
             <span class="wc ${wc>55?'over':''}">${wc} words</span>`}
      </div></div>`;
  }).join('');

  const ap = DATA.filter(r => (state[r.chat_file]||{}).decision === 'approve').length;
  const sk = DATA.filter(r => (state[r.chat_file]||{}).decision === 'skip').length;
  document.getElementById('counts').innerHTML =
    `<b>${DATA.length}</b> drafts · <b>${ap}</b> approved · <b>${sk}</b> skipped · <b>${DATA.length-ap-sk}</b> undecided`;
}
function dec(id, d){ const s = st(id); s.decision = (s.decision === d) ? null : d; save(); }

  localStorage.setItem(KEY, JSON.stringify(state));
  const wc = el.parentElement.querySelector('.wc') || el.nextElementSibling.querySelector('.wc');
  if (wc){ const n = words(el.value); wc.textContent = n + ' words'; wc.className = 'wc' + (n>55?' over':''); } }
function approveAllSafe(){ DATA.filter(r=>r.safety==='safe' && r.message).forEach(r=>{ st(r.chat_file).decision='approve'; }); save(); }
function reset(){ if(confirm('Clear all decisions and edits?')){ state = {}; save(); } }
function approved(){ return DATA.filter(r => r.safety !== 'do_not_send' && (state[r.chat_file]||{}).decision === 'approve'); }
function exportCsv(){
  const rows = [['phone','contact','handles','quoted','message']].concat(
    approved().map(r => [r.phone, r.contact, r.handles, r.price, msgOf(r)]));
  const csv = rows.map(row => row.map(c => '"' + String(c||'').replace(/"/g,'""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'approved-outreach.csv'; a.click();
}
function copyAll(){
  const t = approved().map(r => `${r.phone || r.contact}\n${msgOf(r)}\n`).join('\n');
  navigator.clipboard.writeText(t).then(()=>{
    const h = document.getElementById('hint'); const o = h.textContent;
    h.textContent = `Copied ${approved().length} approved messages.`; setTimeout(()=>h.textContent=o, 2500);
  });
}
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.f; render();
});
render();
</script></body></html>
